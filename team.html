<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GMS Consulting | Team</title>
<meta name="description" content="Das Team der GMS Consulting GmbH. Lerne die Köpfe hinter GMS kennen.">
<meta name="theme-color" content="#0A0A0F">
<meta property="og:type" content="website">
<meta property="og:title" content="Unser Team – GMS Consulting GmbH">
<meta property="og:description" content="Die Köpfe hinter GMS Consulting GmbH">
<meta property="og:url" content="https://team.gmsit.ch">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231C2BFF'/><text x='50' y='70' font-family='Arial' font-size='50' font-weight='900' fill='white' text-anchor='middle'>g</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#1C2BFF; --accent-2:#7E88FF; --glow:rgba(28,43,255,.55);
  --bg:#0A0A0F; --card:#121218; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --text:#fff; --muted:rgba(255,255,255,.56); --muted-2:rgba(255,255,255,.40);
}
*{margin:0; padding:0; box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter','Helvetica Neue',Helvetica,Arial,system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center; padding:32px 16px;
  -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 42% at 50% -8%, var(--glow), transparent 70%),
    radial-gradient(46% 36% at 92% 4%, rgba(110,60,255,.26), transparent 70%),
    radial-gradient(42% 34% at 4% 99%, rgba(28,43,255,.18), transparent 70%);
}
.wrap{position:relative; z-index:1; width:100%; max-width:780px}
.top{text-align:center; margin-bottom:26px}
.logo{height:28px; display:inline-flex; align-items:center}
.logo img{height:28px; width:auto; display:block}
.logo .fb{display:none; font-weight:900; font-size:24px; letter-spacing:-1px; color:#fff}
h1{margin-top:16px; font-size:28px; font-weight:800; letter-spacing:-1px}
.sub{margin-top:8px; font-size:13.5px; font-weight:500; color:var(--muted)}

/* MOBILE-FIRST: eine Spalte, kompakte Listen-Kacheln */
.grid{display:grid; grid-template-columns:1fr; gap:11px}
.tile{
  display:flex; align-items:center; gap:14px; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:14px 16px; text-decoration:none; color:inherit; cursor:pointer;
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
  -webkit-tap-highlight-color:transparent;
}
.tile:hover{border-color:var(--accent); background:#15151d; box-shadow:0 14px 30px rgba(28,43,255,.18)}
.tile:active{transform:scale(.99)}
.av{
  width:56px; height:56px; flex:0 0 auto; border-radius:50%; overflow:hidden; position:relative;
  background:linear-gradient(135deg,#1C2BFF,#7E88FF);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:19px; letter-spacing:-1px;
  box-shadow:0 6px 18px rgba(28,43,255,.36);
}
.av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.tinfo{flex:1; min-width:0}
.nm{font-size:15px; font-weight:800; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rl{font-size:12px; font-weight:600; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.go{flex:0 0 auto; display:inline-flex; align-items:center; color:var(--accent-2)}
.go .go-tx{display:none}
.go svg{width:20px; height:20px}

.foot{margin-top:26px; text-align:center; font-size:11.5px; font-weight:600; color:var(--muted-2); letter-spacing:.4px}
.foot a{color:var(--accent-2); text-decoration:none}


/* TABLET / DESKTOP: mehrspaltig, zentrierte Karten */
@media (min-width:600px){
  body{padding:40px 18px}
  .top{margin-bottom:34px}
  .logo, .logo img{height:30px}
  h1{margin-top:20px; font-size:36px}
  .sub{margin-top:9px; font-size:14px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:16px}
  .tile{display:block; text-align:center; padding:26px 18px; border-radius:22px}
  .tile:hover{transform:translateY(-4px); box-shadow:0 20px 44px rgba(28,43,255,.22)}
  .av{width:74px; height:74px; margin:0 auto 14px; font-size:24px}
  .nm{font-size:16.5px; letter-spacing:-.3px; white-space:normal}
  .rl{font-size:12px; margin-top:3px; white-space:normal}
  .go{
    margin-top:14px; padding:6px 13px; border-radius:999px; gap:6px;
    font-size:11.5px; font-weight:700; letter-spacing:.2px;
    background:rgba(28,43,255,.14); border:1px solid rgba(28,43,255,.28);
  }
  .go .go-tx{display:inline}
  .go svg{width:13px; height:13px}
  .foot{margin-top:34px; font-size:12px}
}
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <span class="logo"><img src="https://framerusercontent.com/images/jKL5v4EHsAh79dvtpPrkzc3L2n8.png" alt="gms" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fb">gms</span></span>
      <h1>Unser Team</h1>
      <p class="sub">Die Köpfe hinter der GMS Consulting GmbH</p>
    </header>

    <main class="grid">
      <a class="tile" href="https://danilo.gmsit.ch">
        <div class="av"><span>DG</span><img src="/danilo.jpg" alt="Danilo Gomes" onerror="this.remove()"></div>
        <div class="tinfo">
          <div class="nm">Danilo Gomes</div>
          <div class="rl">Project Manager</div>
        </div>
        <span class="go"><span class="go-tx">Visitenkarte</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
      </a>
      <a class="tile" href="https://milad.gmsit.ch">
        <div class="av"><span>MR</span><img src="/milad.jpg" alt="Milad Rezaei" onerror="this.remove()"></div>
        <div class="tinfo">
          <div class="nm">Milad Rezaei</div>
          <div class="rl">Project Manager</div>
        </div>
        <span class="go"><span class="go-tx">Visitenkarte</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
      </a>
      <a class="tile" href="https://edson.gmsit.ch">
        <div class="av"><span>EG</span><img src="/edson.jpg" alt="Edson Gomes" onerror="this.remove()"></div>
        <div class="tinfo">
          <div class="nm">Edson Gomes</div>
          <div class="rl">Consultant</div>
        </div>
        <span class="go"><span class="go-tx">Visitenkarte</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
      </a>
      <a class="tile" href="https://lukas.gmsit.ch">
        <div class="av"><span>LM</span></div>
        <div class="tinfo">
          <div class="nm">Lukas Miksa</div>
          <div class="rl">Chairman</div>
        </div>
        <span class="go"><span class="go-tx">Visitenkarte</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
      </a>
    </main>

    <p class="foot">team.gmsit.ch &middot; <a href="https://www.gmsit.ch">gmsit.ch</a></p>
  </div>
</body>
</html>
