<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Danilo Gomes – GMS Consulting GmbH</title>
<meta name="description" content="Danilo Gomes – Founder & Managing Director bei GMS Consulting GmbH. Digitale Visitenkarte.">
<meta name="theme-color" content="#0059FF">
<meta property="og:type" content="profile">
<meta property="og:title" content="Danilo Gomes – GMS Consulting GmbH">
<meta property="og:description" content="Founder & Managing Director bei GMS Consulting GmbH">
<meta property="og:image" content="">
<meta property="og:url" content="https://danilo.gmsit.ch">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230059FF'/><text x='50' y='68' font-family='Arial' font-size='52' font-weight='900' fill='white' text-anchor='middle'>G</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0059FF; --blue-d:#0046CC; --soft:#00AEFF;
  --navy:#272727; --muted:#6b6b6b; --line:#ececec;
  --bg:#F8F8F8; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter','Helvetica Neue',Helvetica,Arial,system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--navy);
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:24px 16px; -webkit-font-smoothing:antialiased;
}
.card{
  width:100%; max-width:420px; background:var(--card);
  border:1px solid var(--line); border-radius:28px; overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.07);
}
.head{
  position:relative; height:118px; background:var(--blue);
}
.head .wm{
  position:absolute; top:18px; left:24px; color:#fff;
  font-weight:800; font-size:15px; letter-spacing:.4px;
}
.head .wm b{font-weight:900}
.body{padding:0 28px 30px; margin-top:-52px; text-align:center}
.avatar{
  position:relative; width:104px; height:104px; border-radius:50%;
  margin:0 auto; overflow:hidden;
  background:linear-gradient(135deg,var(--blue),var(--soft));
  border:5px solid var(--card);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:800; font-size:34px; letter-spacing:-1px;
}
.avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.name{margin-top:16px; font-size:26px; font-weight:800; letter-spacing:-.7px}
.role{margin-top:4px; font-size:14px; font-weight:600; color:var(--blue)}
.org{margin-top:9px; font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted)}
.acts{margin-top:26px; display:flex; flex-direction:column; gap:11px}
.btn{
  display:flex; align-items:center; gap:14px;
  padding:14px 16px; border-radius:16px; text-decoration:none;
  border:1px solid var(--line); background:#fff; cursor:pointer;
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{border-color:#bcd0ff; transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,89,255,.08)}
.btn:active{transform:translateY(0) scale(.99)}
.btn .ic{
  width:40px; height:40px; border-radius:12px; flex:0 0 auto;
  background:#E9F0FF; color:var(--blue);
  display:flex; align-items:center; justify-content:center;
}
.btn .ic svg{width:21px; height:21px}
.btn .lbl{flex:1; text-align:left}
.btn .lbl .t{display:block; font-size:14.5px; font-weight:700; line-height:1.2}
.btn .lbl .s{display:block; font-size:11.5px; font-weight:500; color:var(--muted); margin-top:1px}
.btn .ch{color:#c2c6cc; flex:0 0 auto}
.btn .ch svg{width:18px; height:18px}
.btn.primary{background:var(--blue); border-color:var(--blue)}
.btn.primary .ic{background:rgba(255,255,255,.18); color:#fff}
.btn.primary .lbl .t{color:#fff}
.btn.primary .lbl .s{color:rgba(255,255,255,.72)}
.btn.primary .ch{color:rgba(255,255,255,.6)}
.btn.primary:hover{box-shadow:0 8px 20px rgba(0,89,255,.28)}
.vcard-btn{
  margin-top:14px; width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
  padding:13px; border-radius:14px; border:1px dashed #cdd6e3; background:transparent;
  color:var(--blue); font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
  transition:.15s; -webkit-tap-highlight-color:transparent;
}
.vcard-btn:hover{background:#F1F5FF; border-color:var(--blue)}
.vcard-btn svg{width:18px; height:18px}
.foot{margin-top:24px; font-size:11px; font-weight:600; color:#b7bbc2; letter-spacing:.4px}
.foot a{color:#b7bbc2; text-decoration:none}
@media (max-width:380px){.body{padding:0 20px 26px}.name{font-size:23px}}
</style>
</head>
<body>
  <main class="card">
    <div class="head"><span class="wm"><b>GMS</b> Consulting</span></div>
    <div class="body">
      <div class="avatar"><span>DG</span><img src="" alt="Danilo Gomes" onerror="this.remove()"></div>
      <h1 class="name">Danilo Gomes</h1>
      <p class="role">Founder & Managing Director</p>
      <p class="org">GMS Consulting GmbH</p>

      <nav class="acts">
        <a class="btn primary" href="https://www.gmsit.ch" target="_blank" rel="noopener">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>
          <span class="lbl"><span class="t">Website</span><span class="s">gmsit.ch</span></span>
          <span class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </a>
        <a class="btn" href="mailto:danilo@gmsit.ch">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <span class="lbl"><span class="t">Contact me</span><span class="s">danilo@gmsit.ch</span></span>
          <span class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </a>
        <a class="btn" href="tel:+41790000000">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L20 13l2 5v3a1 1 0 0 1-1 1A17 17 0 0 1 4 5a1 1 0 0 1 1-1Z"/></svg></span>
          <span class="lbl"><span class="t">Call me</span><span class="s">+41 79 000 00 00</span></span>
          <span class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </a>
        <a class="btn" href="https://www.linkedin.com/in/danilo-gomes" target="_blank" rel="noopener">
          <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm6 0h3.8v1.65h.05c.53-.95 1.83-1.95 3.77-1.95C20.4 8.7 21 11 21 14v7h-4v-6.2c0-1.48-.03-3.38-2.06-3.38-2.06 0-2.37 1.6-2.37 3.27V21H9V9Z"/></svg></span>
          <span class="lbl"><span class="t">LinkedIn</span><span class="s">Profil ansehen</span></span>
          <span class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </a>
      </nav>

      <button class="vcard-btn" id="saveContact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Zu Kontakten hinzufügen
      </button>

      <p class="foot"><a href="https://team.gmsit.ch">danilo.gmsit.ch</a></p>
    </div>
  </main>

<script>
(function(){
  var d={name:"Danilo Gomes",org:"GMS Consulting GmbH",role:"Founder & Managing Director",email:"danilo@gmsit.ch",phone:"+41790000000",url:"https://www.gmsit.ch"};
  function vcf(){
    var parts=d.name.trim().split(" ");
    var last=parts.length>1?parts.pop():"";
    var first=parts.join(" ");
    return ["BEGIN:VCARD","VERSION:3.0","N:"+last+";"+first+";;;","FN:"+d.name,
      "ORG:"+d.org,"TITLE:"+d.role,"EMAIL;TYPE=WORK:"+d.email,
      "TEL;TYPE=CELL:"+d.phone,"URL:"+d.url,"END:VCARD"].join("\r\n");
  }
  document.getElementById("saveContact").addEventListener("click",function(){
    var blob=new Blob([vcf()],{type:"text/vcard;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=d.name.replace(/\s+/g,"_")+".vcf";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  });
})();
</script>
</body>
</html>
