<style>
:root{
  --accent:#1C2BFF; --accent-2:#7E88FF; --glow:rgba(28,43,255,.55);
  --bg:#0A0A0F; --card:#121218; --row:#181821;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --text:#fff; --muted:rgba(255,255,255,.56); --muted-2:rgba(255,255,255,.40);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter','Helvetica Neue',Helvetica,Arial,system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:32px 16px; -webkit-font-smoothing:antialiased;
  position:relative; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 45% at 50% -8%, var(--glow), transparent 70%),
    radial-gradient(45% 35% at 88% 8%, rgba(110,60,255,.30), transparent 70%),
    radial-gradient(40% 30% at 6% 96%, rgba(28,43,255,.22), transparent 70%);
}
.card{
  position:relative; z-index:1; width:100%; max-width:430px;
  background:var(--card); border:1px solid var(--line); border-radius:30px;
  overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.55);
}
.hero{
  position:relative; height:142px;
  background:linear-gradient(135deg,#1C2BFF 0%,#3A2BFF 52%,#6B2BFF 100%);
  overflow:hidden;
}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 80% 0%,rgba(255,255,255,.22),transparent 55%)}
.hero .logo{position:absolute; top:18px; left:22px; z-index:2; height:26px; display:flex; align-items:center}
.hero .logo img{height:26px; width:auto; display:block}
.hero .logo .fb{display:none; font-weight:900; font-size:22px; letter-spacing:-1px; color:#fff}
.body{padding:0 26px 28px; margin-top:-54px; text-align:center; position:relative}
.avatar{
  position:relative; width:112px; height:112px; border-radius:50%; margin:0 auto;
  overflow:hidden; background:linear-gradient(135deg,#1C2BFF,#7E88FF);
  border:4px solid var(--card);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:800; font-size:38px; letter-spacing:-1px;
  box-shadow:0 10px 30px rgba(28,43,255,.45);
}
.avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.name{margin-top:16px; font-size:25px; font-weight:800; letter-spacing:-.6px}
.role{margin-top:5px; font-size:13.5px; font-weight:600; color:var(--accent-2)}
.org{margin-top:9px; font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--muted-2)}
.save{
  margin-top:22px; width:100%; display:flex; align-items:center; justify-content:center; gap:9px;
  padding:15px; border:none; border-radius:15px; cursor:pointer;
  background:var(--accent); color:#fff; font-family:inherit; font-size:14.5px; font-weight:700;
  box-shadow:0 10px 26px rgba(28,43,255,.42); transition:transform .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.save:hover{transform:translateY(-1px); box-shadow:0 14px 32px rgba(28,43,255,.55)}
.save:active{transform:translateY(0) scale(.99)}
.save svg{width:19px; height:19px}
.list{margin-top:14px; display:flex; flex-direction:column; gap:9px; text-align:left}
.item{
  display:flex; align-items:center; gap:13px; padding:12px 14px;
  border-radius:14px; background:var(--row); border:1px solid var(--line);
  text-decoration:none; color:inherit; transition:border-color .15s ease, background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.item:hover{border-color:var(--line-2); background:#1d1d27}
.item .ic{
  width:38px; height:38px; flex:0 0 auto; border-radius:11px;
  background:rgba(28,43,255,.16); color:var(--accent-2);
  display:flex; align-items:center; justify-content:center;
}
.item .ic svg{width:19px; height:19px}
.item .tx{flex:1; min-width:0}
.item .tx .k{display:block; font-size:10px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--muted-2)}
.item .tx .v{display:block; font-size:13.5px; font-weight:600; color:var(--text); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .ch{color:rgba(255,255,255,.22); flex:0 0 auto}
.item .ch svg{width:17px; height:17px}
.socials{margin-top:20px; display:flex; align-items:center; justify-content:center; gap:11px}
.soc{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--row); border:1px solid var(--line); color:#fff; text-decoration:none;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.soc:hover{transform:translateY(-2px); border-color:var(--accent); background:rgba(28,43,255,.18)}
.soc svg{width:19px; height:19px}
.foot{margin-top:22px; text-align:center; font-size:10.5px; font-weight:600; letter-spacing:.4px; color:var(--muted-2)}
.foot a{color:var(--muted-2); text-decoration:none}
@media (max-width:380px){.body{padding:0 20px 24px}.name{font-size:22px}}
</style>
</head>
<body>
  <main class="card">
    <div class="hero">
      <span class="logo"><img src="https://framerusercontent.com/images/jKL5v4EHsAh79dvtpPrkzc3L2n8.png" alt="gms" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fb">gms</span></span>
    </div>
    <div class="body">
      <div class="avatar"><span>EG</span><img src="" alt="Edson Gomes" onerror="this.remove()"></div>
      <h1 class="name">Edson Gomes</h1>

      <button class="save" id="saveContact">

          <span class="tx"><span class="k">Telefon</span><span class="v">+41 79 746 99 98</span></span>

      <div class="socials">
        <a class="soc" href="https://www.linkedin.com/in/edsongomesdossantos" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm6 0h3.8v1.65h.05c.53-.95 1.83-1.95 3.77-1.95C20.4 8.7 21 11 21 14v7h-4v-6.2c0-1.48-.03-3.38-2.06-3.38-2.06 0-2.37 1.6-2.37 3.27V21H9V9Z"/></svg></a>

        <a class="soc" href="tel:+41797469998" aria-label="Telefon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a1 1 0 0 1-1 1A17 17 0 0 1 4 5a1 1 0 0 1 1-1Z"/></svg></a>

<script>
(function(){
  var d={name:"Edson Gomes",org:"GMS Consulting GmbH",role:"Managing Director & Consultant",email:"edson@gmsit.ch",phone:"+41797469998",url:"https://www.gmsit.ch"};
  function vcf(){
    var parts=d.name.trim().split(" ");
    var last=parts.length>1?parts.pop():"";
    var first=parts.join(" ");
    return ["BEGIN:VCARD","VERSION:3.0","N:"+last+";"+first+";;;","FN:"+d.name,
      "ORG:"+d.org,"TITLE:"+d.role,"EMAIL;TYPE=WORK:"+d.email,
      "TEL;TYPE=CELL:"+d.phone,"ADR;TYPE=WORK:;;Spitalgasse 28;Bern;;3011;Schweiz",
      "URL:"+d.url,"END:VCARD"].join("\r\n");
  }
  document.getElementById("saveContact").addEventListener("click",function(){
    var blob=new Blob([vcf()],{type:"text/vcard;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=d.name.replace(/\s+/g,"_")+".vcf";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  });
})();
</script>
